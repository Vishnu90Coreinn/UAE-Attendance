  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;

      background: linear-gradient(160deg, #eef6f6 0%, #ffffff 60%); }
    main { max-width: 30rem; text-align: center; }
    .badge { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px; background: #0c2a2d; display: flex; align-items: center; justify-content: center; }
    .badge svg { animation: spin 6s linear infinite; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 12px; }
    p { margin: 0 0 10px; font-size: 1.05rem; line-height: 1.5; color: #3d5558; }
    .bar { height: 6px; margin: 24px auto 12px; max-width: 14rem; border-radius: 3px; background: #d8e6e6; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 40%; border-radius: 3px; background: #0c2a2d; animation: slide 1.6s ease-in-out infinite; }
    small { color: #6b8082; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    @media (prefers-reduced-motion: reduce) { .badge svg, .bar span { animation: none; } .bar span { width: 100%; } }
    @media (prefers-color-scheme: dark) {
      body { background: #0c1a1c; color: #e8f1f1; } p { color: #a9bfc1; } small { color: #7f9a9c; }
      .badge { background: #1d4a4f; } .bar { background: #1d3336; } .bar span { background: #6fc3c9; }
    }
