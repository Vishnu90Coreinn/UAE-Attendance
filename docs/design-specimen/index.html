*{box-sizing:border-box}
body{margin:0;background:#e9eeee;color:#13262a;font-family:SpecInter,system-ui,sans-serif;font-size:14px;line-height:1.5}
.bar{position:sticky;top:0;z-index:20;background:#13262aee;backdrop-filter:blur(8px);color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.bar b{font-size:14px;letter-spacing:.02em}.bar span{opacity:.7;font-size:12px}
.seg{display:inline-flex;background:#ffffff1c;border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:#ffffffcc}
.seg button[aria-pressed=true]{background:#fff;color:#13262a}
.bar .replay{all:unset;cursor:pointer;padding:7px 12px;border-radius:9px;background:#d9e8a8;color:#16322d;font-size:12px;font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;max-width:1500px;margin:auto}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.panel{border-radius:22px;padding:22px;min-width:0}
.tag{display:inline-block;font:700 11px/1 SpecInter;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:99px;margin-bottom:16px}
h4{margin:26px 0 10px;font:700 11px/1 SpecInter;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
/* ---------- tokens ---------- */
.cur{--canvas:#f5f7f8;--surface:#fff;--line:#e3e8ea;--ink:#13262a;--ink2:#364b50;--mute:#51666b;--brand:#0f5f63;--brand-hi:#0f5f63;--brand-lo:#0f5f63;--brand-50:#e6f2f2;--brand-ring:#167479;--hero:#0c2a2d;--hero-cta:#0f5f63;--hero-cta-ink:#fff;
 --r-ctl:8px;--r-card:12px;--r-hero:12px;--sh-card:0 1px 2px rgb(19 38 42/.05);--sh-btn:0 1px 2px rgb(19 38 42/.05);--sh-pop:0 8px 24px rgb(19 38 42/.12);
 --f-body:SpecPlex;--f-disp:SpecPlex;--dur:0ms;--ease:linear;background:var(--canvas)}
.new{--canvas:#f3f6f3;--surface:#fff;--line:#e0e8e3;--ink:#16272a;--ink2:#38504d;--mute:#5a706b;--brand:#0f5f63;--brand-hi:#157a7f;--brand-lo:#0c5256;--brand-50:#e9f4ef;--brand-ring:#157a7f;--hero:#123e3a;--hero-cta:#d9e8a8;--hero-cta-ink:#16322d;
 --r-ctl:12px;--r-card:18px;--r-hero:24px;--sh-card:0 1px 2px rgb(16 40 36/.04),0 12px 28px -16px rgb(16 40 36/.14);--sh-btn:0 1px 2px rgb(16 40 36/.12),0 6px 14px -8px rgb(15 95 99/.55);--sh-pop:0 18px 48px -12px rgb(16 40 36/.28),0 2px 6px rgb(16 40 36/.08);
 --f-body:SpecInter;--f-disp:SpecJakarta;--dur:200ms;--ease:cubic-bezier(.2,.8,.2,1);background:var(--canvas)}
.new[data-font=plex]{--f-body:SpecPlex;--f-disp:SpecPlex}.new[data-font=inter]{--f-body:SpecInter;--f-disp:SpecInter}.new[data-font=jakarta]{--f-body:SpecInter;--f-disp:SpecJakarta}.new[data-font=manrope]{--f-body:SpecInter;--f-disp:SpecManrope}
.panel{font-family:var(--f-body),system-ui,sans-serif;color:var(--ink)}
.tag{background:var(--brand-50);color:var(--brand)}
.disp{font-family:var(--f-disp),system-ui,sans-serif}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:18px}
.num{font-variant-numeric:tabular-nums}
/* ---------- type ---------- */
.t-page{font:700 26px/1.2 var(--f-disp);letter-spacing:-.015em;margin:0}.new .t-page{font-weight:700;letter-spacing:-.025em;font-size:28px}
.t-card{font:600 16px/1.3 var(--f-disp);margin:0}.t-body{color:var(--ink2);margin:6px 0 0}.t-label{font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.t-big{font:700 40px/1.05 var(--f-disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}.new .t-big{font-size:46px;letter-spacing:-.035em}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:var(--r-hero);padding:22px}
.new .hero{background:radial-gradient(120% 140% at 85% -20%,#1d6a63 0,#123e3a 55%,#0f332f 100%)}
.new .hero::after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:#ffffff0d}
.hero .t-label{color:#ffffffb3}.hero .t-big{margin:8px 0 14px}
.bars{display:grid;gap:12px;margin-top:16px}.bar-row{display:grid;gap:6px;font-size:13px}.bar-row div:first-child{display:flex;justify-content:space-between;color:#ffffffd9}

$$('dialog').forEach(d=>{d.onclick=e=>{if(e.target===d||e.target.closest('[data-close]'))d.close()}});
$$('[data-load]').forEach(b=>b.onclick=()=>{const t=b.innerHTML;b.innerHTML='<span class="spin"></span> Saving...';b.disabled=true;setTimeout(()=>{b.innerHTML=t;b.disabled=false},1400)});
$$('[data-toast]').forEach(b=>b.onclick=()=>{let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent='EXP-000026: AED 2,500.50 paid to Dubai Insurance was recorded.';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)});
</script>
</div></body></html>
